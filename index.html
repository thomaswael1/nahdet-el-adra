<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل خدمة النهضة</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between p-4 sm:p-6">

    <!-- Header -->
    <header class="max-w-xl mx-auto w-full text-center my-4">
        <h1 class="text-2xl sm:text-3xl font-extrabold text-cyan-400 mb-1">استمارة تسجيل الخدمة</h1>
        <p class="text-xs sm:text-sm text-slate-400">سجل مشاركتك وفكرتك للـ 15 يوماً القادمة</p>
    </header>

    <!-- Main Container -->
    <main class="max-w-xl mx-auto w-full flex-grow flex items-center justify-center">

        <!-- Form Card -->
        <div id="form-card" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 w-full shadow-2xl">
            <form id="servant-form" onsubmit="handleSubmit(event)" class="space-y-5">
                
                <!-- Servant Name -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">اسم الخادم *</label>
                    <input type="text" id="servant-name" required placeholder="اكتب اسمك ثلاثياً..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-cyan-500">
                </div>

                <!-- Family Selection -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">الفصل / الأسرة *</label>
                    <select id="family-select" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-cyan-500">
                        <option value="" disabled selected>اختر أسرتك...</option>
                        <option value="أسرة أولى وثانية">أسرة أولى وثانية</option>
                        <option value="أسرة ثالثة ورابعة">أسرة ثالثة ورابعة</option>
                        <option value="أسرة خامسة وسادسة">أسرة خامسة وسادسة</option>
                    </select>
                </div>

                <!-- Date Selection -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">اليوم *</label>
                    <select id="date-select" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-cyan-500">
                        <option value="" disabled selected>اختر اليوم...</option>
                        <option value="اليوم 1 (الجمعة 7 أغسطس)">اليوم 1 (الجمعة 7 أغسطس)</option>
                        <option value="اليوم 2 (السبت 8 أغسطس)">اليوم 2 (السبت 8 أغسطس)</option>
                        <option value="اليوم 3 (الأحد 9 أغسطس)">اليوم 3 (الأحد 9 أغسطس)</option>
                        <option value="اليوم 4 (الإثنين 10 أغسطس)">اليوم 4 (الإثنين 10 أغسطس)</option>
                        <option value="اليوم 5 (الثلاثاء 11 أغسطس)">اليوم 5 (الثلاثاء 11 أغسطس)</option>
                        <option value="اليوم 6 (الأربعاء 12 أغسطس)">اليوم 6 (الأربعاء 12 أغسطس)</option>
                        <option value="اليوم 7 (الخميس 13 أغسطس)">اليوم 7 (الخميس 13 أغسطس)</option>
                        <option value="اليوم 8 (الجمعة 14 أغسطس)">اليوم 8 (الجمعة 14 أغسطس)</option>
                        <option value="اليوم 9 (السبت 15 أغسطس)">اليوم 9 (السبت 15 أغسطس)</option>
                        <option value="اليوم 10 (الأحد 16 أغسطس)">اليوم 10 (الأحد 16 أغسطس)</option>
                        <option value="اليوم 11 (الإثنين 17 أغسطس)">اليوم 11 (الإثنين 17 أغسطس)</option>
                        <option value="اليوم 12 (الثلاثاء 18 أغسطس)">اليوم 12 (الثلاثاء 18 أغسطس)</option>
                        <option value="اليوم 13 (الأربعاء 19 أغسطس)">اليوم 13 (الأربعاء 19 أغسطس)</option>
                        <option value="اليوم 14 (الخميس 20 أغسطس)">اليوم 14 (الخميس 20 أغسطس)</option>
                        <option value="اليوم 15 (الجمعة 21 أغسطس)">اليوم 15 (الجمعة 21 أغسطس)</option>
                    </select>
                </div>

                <!-- Has Idea Choice -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-2">مجهز فقرة أو فكرة؟ *</label>
                    <div class="flex gap-4">
                        <label class="flex-1 bg-slate-950 border border-slate-800 rounded-xl p-3 flex items-center justify-center gap-2 cursor-pointer hover:border-slate-700">
                            <input type="radio" name="has-idea" value="yes" onchange="toggleIdeaBox(true)" class="accent-cyan-500" required>
                            <span class="text-xs font-bold text-slate-200">نعم</span>
                        </label>
                        <label class="flex-1 bg-slate-950 border border-slate-800 rounded-xl p-3 flex items-center justify-center gap-2 cursor-pointer hover:border-slate-700">
                            <input type="radio" name="has-idea" value="no" onchange="toggleIdeaBox(false)" class="accent-cyan-500">
                            <span class="text-xs font-bold text-slate-200">لا</span>
                        </label>
                    </div>
                </div>

                <!-- Idea Textarea -->
                <div id="idea-container" class="hidden">
                    <label class="block text-xs font-semibold text-cyan-400 mb-1.5">تفاصيل الفقرة / الفكرة *</label>
                    <textarea id="idea-text" rows="3" placeholder="اكتب فكرتك بالتفصيل هنا..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-100 focus:outline-none focus:border-cyan-500 resize-none"></textarea>
                </div>

                <!-- Notes for Admin -->
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1.5">ملاحظات للأمين (اختياري)</label>
                    <textarea id="admin-notes" rows="2" placeholder="أي استفسار أو تنبيه خاص بيك..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-slate-700 resize-none"></textarea>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submit-btn" class="w-full bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-bold text-sm py-3 rounded-xl transition shadow-lg shadow-cyan-950">
                    إرسال التسجيل
                </button>
            </form>
        </div>

        <!-- Thank You Card -->
        <div id="thankyou-card" class="hidden bg-slate-900 border border-emerald-500/30 rounded-2xl p-8 w-full text-center shadow-2xl">
            <div class="w-16 h-16 bg-emerald-500/10 text-emerald-400 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl font-bold">✓</div>
            <h2 class="text-2xl font-bold text-slate-100 mb-2">شكراً على خدمتك!</h2>
            <p class="text-xs text-slate-400 mb-6">تم تسجيل بياناتك وفكرتك بنجاح في الشيت.</p>
            
            <button onclick="resetForm()" class="bg-slate-800 hover:bg-slate-700 text-cyan-400 font-bold text-xs px-6 py-3 rounded-xl border border-slate-700 transition">
                تسجيل مشاركة أخرى +
            </button>
        </div>

    </main>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzGMMo8mE7_RXEDMnZ-glfmH9kqd4rMm-FMNAIUlZYX4oHTMLKXx6A1dsPImA08KqoNAw/exec";

        function toggleIdeaBox(show) {
            const container = document.getElementById('idea-container');
            const textarea = document.getElementById('idea-text');
            if (show) {
                container.classList.remove('hidden');
                textarea.required = true;
            } else {
                container.classList.add('hidden');
                textarea.required = false;
                textarea.value = '';
            }
        }

        function handleSubmit(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.innerText = "جاري الإرسال لجوجل شيت...";
            submitBtn.disabled = true;

            const formData = {
                name: document.getElementById('servant-name').value.trim(),
                family: document.getElementById('family-select').value,
                date: document.getElementById('date-select').value,
                hasIdea: document.querySelector('input[name="has-idea"]:checked')?.value === 'yes',
                ideaText: document.getElementById('idea-text').value.trim(),
                adminNotes: document.getElementById('admin-notes').value.trim()
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            })
            .then(() => {
                showThankYou();
            })
            .catch(error => {
                console.error('Error:', error);
                alert('حدث خطأ في الاتصال، حاول ثانية.');
                submitBtn.innerText = "إرسال التسجيل";
                submitBtn.disabled = false;
            });
        }

        function showThankYou() {
            document.getElementById('form-card').classList.add('hidden');
            document.getElementById('thankyou-card').classList.remove('hidden');
        }

        function resetForm() {
            document.getElementById('servant-form').reset();
            toggleIdeaBox(false);
            document.getElementById('submit-btn').innerText = "إرسال التسجيل";
            document.getElementById('submit-btn').disabled = false;

            document.getElementById('thankyou-card').classList.add('hidden');
            document.getElementById('form-card').classList.remove('hidden');
        }
    </script>
</body>
</html>
