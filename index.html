<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل خدمة النهضة</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between p-4 sm:p-6">

    <!-- Header -->
    <header class="max-w-xl mx-auto w-full text-center my-4">
        <h1 class="text-2xl sm:text-3xl font-extrabold text-cyan-400 mb-1">استمارة تسجيل الخدمة</h1>
        <p class="text-xs sm:text-sm text-slate-400">سجل مشاركتك وفكرتك للـ 15 يوماً القادمة</p>
    </header>

    <!-- Main Container -->
    <main class="max-w-xl mx-auto w-full flex-grow flex items-center justify-center flex-col">

        <!-- 1. Form Card -->
        <div id="form-card" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 w-full shadow-2xl">
            <form id="servant-form" onsubmit="handleSubmit(event)" class="space-y-5">
                
                <!-- Servant Name -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">اسم الخادم *</label>
                    <input type="text" id="servant-name" required placeholder="اكتب اسمك ثلاثياً..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-cyan-500">
                </div>

                <!-- Family Selection -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">الفصل / الأسرة *</label>
                    <select id="family-select" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-cyan-500">
                        <option value="" disabled selected>اختر أسرتك...</option>
                        <option value="أسرة أولى وثانية">أسرة أولى وثانية</option>
                        <option value="أسرة ثالثة ورابعة">أسرة ثالثة ورابعة</option>
                        <option value="أسرة خامسة وسادسة">أسرة خامسة وسادسة</option>
                    </select>
                </div>

                <!-- Date Selection -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">اليوم *</label>
                    <select id="date-select" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-cyan-500">
                        <option value="" disabled selected>اختر اليوم...</option>
                        <option value="اليوم 1 (الجمعة 7 أغسطس)">اليوم 1 (الجمعة 7 أغسطس)</option>
                        <option value="اليوم 2 (السبت 8 أغسطس)">اليوم 2 (السبت 8 أغسطس)</option>
                        <option value="اليوم 3 (الأحد 9 أغسطس)">اليوم 3 (الأحد 9 أغسطس)</option>
                        <option value="اليوم 4 (الإثنين 10 أغسطس)">اليوم 4 (الإثنين 10 أغسطس)</option>
                        <option value="اليوم 5 (الثلاثاء 11 أغسطس)">اليوم 5 (الثلاثاء 11 أغسطس)</option>
                        <option value="اليوم 6 (الأربعاء 12 أغسطس)">اليوم 6 (الأربعاء 12 أغسطس)</option>
                        <option value="اليوم 7 (الخميس 13 أغسطس)">اليوم 7 (الخميس 13 أغسطس)</option>
                        <option value="اليوم 8 (الجمعة 14 أغسطس)">اليوم 8 (الجمعة 14 أغسطس)</option>
                        <option value="اليوم 9 (السبت 15 أغسطس)">اليوم 9 (السبت 15 أغسطس)</option>
                        <option value="اليوم 10 (الأحد 16 أغسطس)">اليوم 10 (الأحد 16 أغسطس)</option>
                        <option value="اليوم 11 (الإثنين 17 أغسطس)">اليوم 11 (الإثنين 17 أغسطس)</option>
                        <option value="اليوم 12 (الثلاثاء 18 أغسطس)">اليوم 12 (الثلاثاء 18 أغسطس)</option>
                        <option value="اليوم 13 (الأربعاء 19 أغسطس)">اليوم 13 (الأربعاء 19 أغسطس)</option>
                        <option value="اليوم 14 (الخميس 20 أغسطس)">اليوم 14 (الخميس 20 أغسطس)</option>
                        <option value="اليوم 15 (الجمعة 21 أغسطس)">اليوم 15 (الجمعة 21 أغسطس)</option>
                    </select>
                </div>

                <!-- Has Idea Choice -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-2">مجهز فقرة أو فكرة؟ *</label>
                    <div class="flex gap-4">
                        <label class="flex-1 bg-slate-950 border border-slate-800 rounded-xl p-3 flex items-center justify-center gap-2 cursor-pointer hover:border-slate-700">
                            <input type="radio" name="has-idea" value="yes" onchange="toggleIdeaBox(true)" class="accent-cyan-500" required>
                            <span class="text-xs font-bold text-slate-200">نعم</span>
                        </label>
                        <label class="flex-1 bg-slate-950 border border-slate-800 rounded-xl p-3 flex items-center justify-center gap-2 cursor-pointer hover:border-slate-700">
                            <input type="radio" name="has-idea" value="no" onchange="toggleIdeaBox(false)" class="accent-cyan-500">
                            <span class="text-xs font-bold text-slate-200">لا</span>
                        </label>
                    </div>
                </div>

                <!-- Idea Textarea -->
                <div id="idea-container" class="hidden">
                    <label class="block text-xs font-semibold text-cyan-400 mb-1.5">تفاصيل الفقرة / الفكرة *</label>
                    <textarea id="idea-text" rows="3" placeholder="اكتب فكرتك بالتفصيل هنا..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-100 focus:outline-none focus:border-cyan-500 resize-none"></textarea>
                </div>

                <!-- Notes for Admin -->
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1.5">ملاحظات للأمين (اختياري)</label>
                    <textarea id="admin-notes" rows="2" placeholder="أي استفسار أو تنبيه خاص بيك..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-slate-700 resize-none"></textarea>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submit-btn" class="w-full bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-bold text-sm py-3 rounded-xl transition shadow-lg shadow-cyan-950">
                    إرسال التسجيل
                </button>
            </form>
        </div>

        <!-- 2. Thank You Card -->
        <div id="thankyou-card" class="hidden bg-slate-900 border border-emerald-500/30 rounded-2xl p-8 w-full text-center shadow-2xl">
            <div class="w-16 h-16 bg-emerald-500/10 text-emerald-400 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl font-bold">✓</div>
            <h2 class="text-2xl font-bold text-slate-100 mb-2">شكراً على خدمتك!</h2>
            <p class="text-xs text-slate-400 mb-6">تم تسجيل بياناتك وفكرتك بنجاح في الشيت.</p>
            
            <button onclick="resetForm()" class="bg-slate-800 hover:bg-slate-700 text-cyan-400 font-bold text-xs px-6 py-3 rounded-xl border border-slate-700 transition">
                تسجيل مشاركة أخرى +
            </button>
        </div>

        <!-- 3. Admin Dashboard View -->
        <div id="admin-dashboard" class="hidden bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full shadow-2xl space-y-6">
            <div class="flex justify-between items-center border-b border-slate-800 pb-4">
                <h2 class="text-lg font-bold text-cyan-400">لوحة تحكم الأمين 🔒</h2>
                <div class="flex gap-2">
                    <button onclick="fetchSheetSubmissions()" class="text-xs bg-cyan-950 text-cyan-400 hover:bg-cyan-900 border border-cyan-800 px-3 py-1.5 rounded-lg transition">تحديث 🔄</button>
                    <button onclick="closeAdminDashboard()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700">خروج</button>
                </div>
            </div>

            <!-- Calendar Selector -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-2">اختر اليوم لمشاهدة التسجيلات:</label>
                <div id="admin-days-grid" class="grid grid-cols-3 sm:grid-cols-5 gap-2">
                    <!-- Days Buttons Generated Dynamically -->
                </div>
            </div>

            <!-- Details Display -->
            <div id="day-details-container" class="space-y-4 pt-2">
                <div class="text-center text-xs text-slate-500 py-6">اختر يوماً من الأعلى لعرض تفاصيل التسجيلات والأسر</div>
            </div>
        </div>

    </main>

    <!-- Footer Admin Button -->
    <footer class="max-w-xl mx-auto w-full text-center mt-6 pt-4 border-t border-slate-900">
        <button onclick="openAdminModal()" class="text-xs text-slate-600 hover:text-cyan-400 transition flex items-center gap-1.5 mx-auto">
            <span>🔒</span> دخول الأمين
        </button>
    </footer>

    <!-- Admin Password Modal -->
    <div id="password-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-xs p-6 text-center shadow-2xl relative">
            <button onclick="closePasswordModal()" class="absolute top-3 left-3 text-slate-500 hover:text-slate-300">✕</button>
            <h3 class="text-sm font-bold text-slate-100 mb-4">كلمة سر الأمين</h3>
            <input type="password" id="admin-pass-input" placeholder="أدخل الرقم السرّي..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-center text-sm text-slate-100 focus:outline-none focus:border-cyan-500 mb-4">
            <button onclick="verifyAdminPassword()" class="w-full bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-bold text-xs py-2.5 rounded-xl transition">تأكيد الدخول</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz3mbeEa1FMLvq8alMnUnvUoneF5bsprXmMFtabIFiVmga1XRhyRrlEAKizMyIIJ82eXg/exec";

        const daysList = [
            "اليوم 1 (الجمعة 7 أغسطس)",
            "اليوم 2 (السبت 8 أغسطس)",
            "اليوم 3 (الأحد 9 أغسطس)",
            "اليوم 4 (الإثنين 10 أغسطس)",
            "اليوم 5 (الثلاثاء 11 أغسطس)",
            "اليوم 6 (الأربعاء 12 أغسطس)",
            "اليوم 7 (الخميس 13 أغسطس)",
            "اليوم 8 (الجمعة 14 أغسطس)",
            "اليوم 9 (السبت 15 أغسطس)",
            "اليوم 10 (الأحد 16 أغسطس)",
            "اليوم 11 (الإثنين 17 أغسطس)",
            "اليوم 12 (الثلاثاء 18 أغسطس)",
            "اليوم 13 (الأربعاء 19 أغسطس)",
            "اليوم 14 (الخميس 20 أغسطس)",
            "اليوم 15 (الجمعة 21 أغسطس)"
        ];

        let selectedAdminDay = null;
        let sheetSubmissions = [];

        function toggleIdeaBox(show) {
            const container = document.getElementById('idea-container');
            const textarea = document.getElementById('idea-text');
            if (show) {
                container.classList.remove('hidden');
                textarea.required = true;
            } else {
                container.classList.add('hidden');
                textarea.required = false;
                textarea.value = '';
            }
        }

        function handleSubmit(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.innerText = "جاري الإرسال لجوجل شيت...";
            submitBtn.disabled = true;

            const formData = {
                name: document.getElementById('servant-name').value.trim(),
                family: document.getElementById('family-select').value,
                date: document.getElementById('date-select').value,
                hasIdea: document.querySelector('input[name="has-idea"]:checked')?.value === 'yes',
                ideaText: document.getElementById('idea-text').value.trim(),
                adminNotes: document.getElementById('admin-notes').value.trim()
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            })
            .then(() => {
                showThankYou();
            })
            .catch(error => {
                console.error('Error:', error);
                alert('حدث خطأ في الاتصال، حاول ثانية.');
                submitBtn.innerText = "إرسال التسجيل";
                submitBtn.disabled = false;
            });
        }

        function showThankYou() {
            document.getElementById('form-card').classList.add('hidden');
            document.getElementById('thankyou-card').classList.remove('hidden');
        }

        function resetForm() {
            document.getElementById('servant-form').reset();
            toggleIdeaBox(false);
            document.getElementById('submit-btn').innerText = "إرسال التسجيل";
            document.getElementById('submit-btn').disabled = false;

            document.getElementById('thankyou-card').classList.add('hidden');
            document.getElementById('form-card').classList.remove('hidden');
        }

        // ================= ADMIN FUNCTIONS =================
        function openAdminModal() {
            document.getElementById('password-modal').classList.remove('hidden');
            document.getElementById('admin-pass-input').value = '';
            document.getElementById('admin-pass-input').focus();
        }

        function closePasswordModal() {
            document.getElementById('password-modal').classList.add('hidden');
        }

        function verifyAdminPassword() {
            const pass = document.getElementById('admin-pass-input').value;
            if (pass === '456456') {
                closePasswordModal();
                openAdminDashboard();
            } else {
                alert('كلمة السر غير صحيحة!');
            }
        }

        function openAdminDashboard() {
            document.getElementById('form-card').classList.add('hidden');
            document.getElementById('thankyou-card').classList.add('hidden');
            document.getElementById('admin-dashboard').classList.remove('hidden');

            renderAdminCalendarGrid();
            fetchSheetSubmissions();
        }

        function closeAdminDashboard() {
            document.getElementById('admin-dashboard').classList.add('hidden');
            document.getElementById('form-card').classList.remove('hidden');
        }

        function fetchSheetSubmissions() {
            const container = document.getElementById('day-details-container');
            container.innerHTML = '<div class="text-center text-xs text-cyan-400 py-6">جاري تحميل البيانات من Google Sheets... ⏳</div>';

            fetch(SCRIPT_URL)
                .then(res => res.json())
                .then(data => {
                    sheetSubmissions = data || [];
                    if (selectedAdminDay) {
                        renderDayDetails();
                    } else {
                        container.innerHTML = '<div class="text-center text-xs text-slate-500 py-6">اختر يوماً من الأعلى لعرض تفاصيل التسجيلات والأسر</div>';
                    }
                })
                .catch(err => {
                    console.error('Error fetching data:', err);
                    container.innerHTML = '<div class="text-center text-xs text-rose-400 py-6">عذراً، تعذر جلب البيانات من الشيت. تأكد من جود دالة doGet بالكريبت.</div>';
                });
        }

        function renderAdminCalendarGrid() {
            const grid = document.getElementById('admin-days-grid');
            grid.innerHTML = '';

            daysList.forEach((dayText, idx) => {
                const btn = document.createElement('button');
                btn.className = `p-2 rounded-xl text-xs font-bold border border-slate-800 transition ${selectedAdminDay === dayText ? 'bg-cyan-600 text-slate-950 border-cyan-500' : 'bg-slate-950 text-slate-300 hover:border-slate-700'}`;
                btn.innerText = `يوم ${idx + 1}`;
                btn.onclick = () => selectAdminDay(dayText);

                grid.appendChild(btn);
            });
        }

        function selectAdminDay(dayText) {
            selectedAdminDay = dayText;
            renderAdminCalendarGrid();
            renderDayDetails();
        }

        function renderDayDetails() {
            const container = document.getElementById('day-details-container');
            if (!selectedAdminDay) return;

            const daySubmissions = sheetSubmissions.filter(s => s.date === selectedAdminDay);
            container.innerHTML = '';

            const families = ['أسرة أولى وثانية', 'أسرة ثالثة ورابعة', 'أسرة خامسة وسادسة'];

            families.forEach(famName => {
                const fSubmissions = daySubmissions.filter(s => s.family === famName);

                const famBox = document.createElement('div');
                famBox.className = "bg-slate-950 border border-slate-800/80 rounded-xl p-4";

                let submissionsHtml = '';
                if (fSubmissions.length === 0) {
                    submissionsHtml = `<p class="text-xs text-slate-600 italic">لا توجد تسجيلات لهذه الأسرة في هذا اليوم</p>`;
                } else {
                    submissionsHtml = fSubmissions.map(item => `
                        <div class="bg-slate-900 border border-slate-800/60 rounded-lg p-3 text-xs space-y-1.5 relative">
                            <div class="font-bold text-slate-100">${item.name}</div>
                            ${item.hasIdea ? `<div class="text-cyan-400 bg-cyan-950/40 p-2 rounded border border-cyan-900/50"><strong class="block text-[10px] text-cyan-300">الفكرة:</strong> ${item.ideaText}</div>` : '<div class="text-slate-500">بدون فقرة</div>'}
                            ${item.adminNotes && item.adminNotes !== '-' ? `<div class="text-amber-400/90 bg-amber-950/20 p-2 rounded border border-amber-900/40"><strong class="block text-[10px] text-amber-300">ملاحظة للأمين:</strong> ${item.adminNotes}</div>` : ''}
                        </div>
                    `).join('');
                }

                famBox.innerHTML = `
                    <div class="flex justify-between items-center mb-3">
                        <h4 class="text-xs font-bold text-cyan-400">${famName}</h4>
                        <span class="text-[10px] bg-slate-900 px-2 py-0.5 rounded text-slate-400">${fSubmissions.length} مشارك</span>
                    </div>
                    <div class="space-y-2">
                        ${submissionsHtml}
                    </div>
                `;

                container.appendChild(famBox);
            });
        }
    </script>
</body>
</html>
